# ─────────────────────────────────────────
#  تنظیم Nginx برای چوبساب (VPS)
#  این فایل را در /etc/nginx/sites-available/choobsab کپی کنید،
#  سپس: sudo ln -s /etc/nginx/sites-available/choobsab /etc/nginx/sites-enabled/
#  و بعد: sudo nginx -t && sudo systemctl reload nginx
#  جای YOUR-DOMAIN.com را با دامنه واقعی خودتان عوض کنید.
# ─────────────────────────────────────────
server {
    listen 80;
    server_name YOUR-DOMAIN.com www.YOUR-DOMAIN.com;

    client_max_body_size 20m;  # برای آپلود عکس محصولات (تا ~۹ مگابایت)

    # هدرهای امنیتی
    add_header X-Content-Type-Options nosniff;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # فایلهای استاتیک را مستقیم به Nginx بسپاریم (سرعت بیشتر)
    location /assets/ {
        alias /var/www/choobsab/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# بعد از فعال شدن دامنه + HTTPS، SSL خودکار:
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d YOUR-DOMAIN.com -d www.YOUR-DOMAIN.com