# ─────────────────────────────────────────
#  تنظیم Nginx برای چوبساب (VPS + SSL)
# ─────────────────────────────────────────

# ریدایرکت HTTP به HTTPS
server {
    listen 80;
    server_name choobsab-decor.ir www.choobsab-decor.ir;
    return 301 https://choobsab-decor.ir$request_uri;
}

# سرور HTTPS (هم www و هم non-www)
server {
    listen 443 ssl;
    server_name choobsab-decor.ir www.choobsab-decor.ir;

    # گواهی SSL
    ssl_certificate /etc/letsencrypt/live/choobsab-decor.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/choobsab-decor.ir/privkey.pem;

    client_max_body_size 20m;

    # هدرهای امنیتی
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # فایلهای استاتیک
    location /assets/ {
        alias /var/www/choobsab/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
